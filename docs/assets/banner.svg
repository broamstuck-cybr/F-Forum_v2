<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="F-Forum_v2 architectural bridge banner">
  <defs>
    <linearGradient id="bgFF2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0d1422"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <radialGradient id="glowFF2" cx="76%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#1793d1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridFF2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="clipFF2">
      <rect width="880" height="220" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipFF2)">
    <rect width="880" height="220" fill="url(#bgFF2)"/>
    <rect width="880" height="220" fill="url(#gridFF2)"/>
    <rect width="880" height="220" fill="url(#glowFF2)"/>

    <!-- Left emblem: 3-stage bridge arch -->
    <g transform="translate(46, 48)">
      <rect width="52" height="52" rx="10" fill="#111622" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 12 38 C 12 20, 40 20, 40 38" fill="none" stroke="#1793d1" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="38" r="3" fill="#64748b"/>
      <circle cx="26" cy="24" r="3" fill="#e3b341"/>
      <circle cx="40" cy="38" r="3.5" fill="#39d353"/>
    </g>

    <!-- Title -->
    <g transform="translate(114, 56)">
      <text x="0" y="18" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#f8fafc">F-Forum_v2</text>
      <text x="0" y="42" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">Evolutionary Bridge: f-forum (v1) to f_forumv3 (Live)</text>
    </g>

    <!-- Pills -->
    <g transform="translate(46, 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      <rect x="0" y="0" width="128" height="24" rx="5" fill="#111622" stroke="#e3b341" stroke-opacity="0.65"/>
      <circle cx="12" cy="12" r="3" fill="#e3b341"/>
      <text x="22" y="15.5" fill="#fde68a">ARCHIVE BRIDGE</text>

      <rect x="138" y="0" width="112" height="24" rx="5" fill="#111622" stroke="#1e293b"/>
      <circle cx="150" cy="12" r="3" fill="#1793d1"/>
      <text x="160" y="15.5" fill="#cbd5e1">V1 -&gt; V2 -&gt; V3</text>

      <rect x="260" y="0" width="128" height="24" rx="5" fill="#111622" stroke="#39d353" stroke-opacity="0.65"/>
      <circle cx="272" cy="12" r="3" fill="#39d353">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="282" y="15.5" fill="#bbf7d0">LIVE AT V3</text>
    </g>

    <text x="46" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748b">LIVE: https://fforum3.vercel.app  |  SOURCE: f_forumv3</text>

    <!-- Right Artwork: v1 -> v2 -> v3 Generational Bridge -->
    <g transform="translate(474, 28)">
      <rect width="370" height="164" rx="10" fill="#0b101b" fill-opacity="0.94" stroke="#1e293b" stroke-width="1.2"/>

      <!-- Connection Spine -->
      <line x1="66" y1="82" x2="304" y2="82" stroke="#1e293b" stroke-width="2"/>
      <path d="M 66 82 C 124 44, 246 44, 304 82" fill="none" stroke="#1793d1" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Animated evolution pulse -->
      <circle cx="66" cy="82" r="4" fill="#39d353">
        <animateMotion dur="4.2s" repeatCount="indefinite" path="M 0 0 C 58 -38, 180 -38, 238 0"/>
      </circle>

      <!-- Node v1 -->
      <g transform="translate(18, 54)">
        <rect width="94" height="56" rx="7" fill="#111622" stroke="#1793d1" stroke-width="1.2"/>
        <text x="47" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#1793d1">V1 LEGACY</text>
        <text x="47" y="37" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0">f-forum</text>
        <text x="47" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#64748b">Initial build</text>
      </g>

      <!-- Node v2 (current) -->
      <g transform="translate(138, 54)">
        <rect width="94" height="56" rx="7" fill="#111622" stroke="#e3b341" stroke-width="1.4"/>
        <text x="47" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#e3b341">V2 BRIDGE</text>
        <text x="47" y="37" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#fde68a">F-Forum_v2</text>
        <text x="47" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#94a3b8">Placeholder</text>
      </g>

      <!-- Node v3 (live) -->
      <g transform="translate(258, 54)">
        <rect width="94" height="56" rx="7" fill="#111622" stroke="#39d353" stroke-width="1.4"/>
        <text x="47" y="21" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#39d353">V3 LIVE</text>
        <text x="47" y="37" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">f_forumv3</text>
        <text x="47" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" fill="#39d353">fforum3.vercel</text>
      </g>

      <text x="185" y="140" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">NO APP SOURCE IN THIS REPO  |  SEE f_forumv3</text>
    </g>

    <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>
